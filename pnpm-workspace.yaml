# Every external version lives here; package.json files use `catalog:`,
# `catalog:peers` or `workspace:*`. After editing, run `vp install` and commit
# pnpm-lock.yaml.
packages:
  - packages/*

catalogMode: strict

catalog:
  '@changesets/changelog-github': ^1.0.1
  '@changesets/cli': ^3.0.3
  '@effect/docgen': ^4.1.4
  # Test-only: the /sparql/sql PostgreSQL suite runs on PGlite.
  '@electric-sql/pglite': 0.5.17
  '@effect/language-service': ^0.87.5
  # Exact, in lockstep with `effect`. `@effect/sql-*` are core devDependencies
  # (the /sparql/sql suites' drivers), never runtime dependencies or peers.
  '@effect/platform-node': 4.1.4
  '@effect/sql-pg': 4.1.4
  '@effect/sql-sqlite-node': 4.1.4
  # `effect-tsgo patch` (the `prepare` script) supports only the native `tsc`
  # and the vite-plus oxlint / tsgolint versions listed in the `components`
  # table of node_modules/@effect/tsgo/dist/effect-tsgo.cjs, and fails
  # `vp install` on anything else. Move it with `@typescript/native` and
  # `vite-plus`.
  '@effect/tsgo': 0.69.0
  '@effect/vitest': 4.1.4
  '@enfect/oxlint': ^0.10.0
  '@thomasfosterau/effect-ext': 0.3.1
  '@thomasfosterau/effect-parse': 0.6.2
  '@thomasfosterau/effect-xml': 0.2.0
  '@types/n3': 1.26.6
  '@types/node': ^26.6.6
  # Must equal the vitest vite-plus bundles.
  '@vitest/coverage-istanbul': 5.1.0
  effect: 4.1.4
  fallow: 3.44.0
  # The reference N3 / Turtle parser, for `bench/n3` only.
  n3: 2.13.12
  # TypeScript 6 (`tsc6`) for JS-API consumers (the language service, tsdown's
  # declaration bundler); TypeScript 7 (`tsc`) is the type checker.
  typescript: 'npm:@typescript/typescript6@6.0.2'
  '@typescript/native': 'npm:typescript@7.0.2'
  vite-plus: 1.6.0
  # npm aliases Dependabot cannot bump: `vite` follows `vite-plus`, `vitest`
  # equals vite-plus's exact pin.
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0

# The ranges the published packages declare.
catalogs:
  peers:
    # Carets: a 0.x minor may break the API the grammars use, so each minor
    # line is listed once the suites pass against it.
    '@thomasfosterau/effect-parse': ^0.4.0 || ^0.5.0
    '@thomasfosterau/effect-xml': ^0.2.0
    '@thomasfosterau/effect-ext': ^0.2.0 || ^0.3.0
    # `^4.0.0` unless a package's own dependencies need more (below).
    effect: ^4.0.0
  # effect-sparql-node: `@effect/platform-node` declares `effect: ^4.1.2`.
  platform-node-peers:
    effect: ^4.1.2

overrides:
  # Singletons: a second copy of `effect` breaks Context / Layer / Schema identity.
  effect: 'catalog:'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
nodeLinker: hoisted
allowBuilds:
  '@effect/tsgo': true
  esbuild: true
  fallow: true

# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]

skills:
  dirs: [.claude/skills]
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

# Hold new versions for 24 hours (minutes); Dependabot's cooldown is 1 day.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@thomasfosterau/*'
