# pnpm workspace — the published @thomasfosterau/effect-rdf package family.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
packages:
  - packages/*

catalogMode: strict

catalog:
  '@changesets/changelog-github': ^1.0.1
  '@changesets/cli': ^3.0.3
  # Test-only: the SPARQL-to-SQL backend's PostgreSQL suite runs on PGlite.
  '@electric-sql/pglite': 0.5.11
  # The Effect Language Service plugin named in tsconfig.base.json; the
  # patched native `tsc` (see @effect/tsgo) runs its diagnostics.
  '@effect/language-service': ^0.87.5
  # Exact, in lockstep with `effect` below: each declares `effect: ^<its version>`.
  '@effect/platform-node': 4.0.5
  '@effect/sql-pg': 4.0.5
  '@effect/sql-sqlite-node': 4.0.5
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below and with the `oxlint` and `oxlint-tsgolint`
  # that `vite-plus` pulls in: 0.63.0 supports typescript 7.0.2, oxlint
  # 1.88.0 – 1.90.0 and tsgolint 7.0.2004 / 7.0.2005 (vite-plus 1.4.0 carries
  # oxlint 1.89.0 and tsgolint 7.0.2004). Each @effect/tsgo release hard-errors
  # (UnsupportedTargetPackageVersionError) on any other component version,
  # failing `pnpm install` itself in the `prepare` script. Read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before bumping any of the three.
  '@effect/tsgo': 0.63.0
  # Must match `vitest` below: its peer is `vitest: >=5.0.0 <6.0.0`, and its
  # `effect` peer follows the singleton.
  '@effect/vitest': 4.0.5
  # The Effect oxlint plugin (`effect/*` rules, registered as a `jsPlugins`
  # entry by its `configs.recommended`). It runs inside oxlint, so it moves
  # with the toolchain set. 0.9.0 depends on `effect` 4.1.0 (exact) but runs
  # on the workspace singleton (the `effect` override below); its
  # `vite.config.ts` load calls Effect APIs, so an `effect` bump re-runs
  # `vp check` against the plugin too.
  '@enfect/oxlint': ^0.9.0
  # Parser-combinator library behind the Turtle, N-Triples, N3, ShExC, SPARQL
  # and XML grammars; a peer of the packages that use it (see `catalogs.peers`).
  '@thomasfosterau/effect-parse': 0.4.0
  '@types/node': ^26.6.5
  # Must equal the vitest that vite-plus bundles (see `vitest` below); vite-plus
  # refuses to run coverage on a mismatch.
  '@vitest/coverage-istanbul': 5.0.5
  effect: 4.0.5
  fallow: 3.37.0
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, tsdown's
  # declaration bundler) stay on TS6 while native `tsc` type-checks. The alias
  # keeps the package importable as `typescript` name-stable at the TS6 JS
  # compiler (bin `tsc6`); `@typescript/native` is TS7 (bin `tsc`). Pinned
  # exact: @typescript/native's gitHead must match @effect/tsgo's bundled binary.
  typescript: 'npm:@typescript/typescript6@6.0.2'
  '@typescript/native': 'npm:typescript@7.0.2'
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint version `effect-tsgo patch --oxlint` has to
  # support (see the @effect/tsgo note above): 1.4.0 carries oxlint 1.89.0,
  # tsgolint 7.0.2004, oxfmt 0.74.0 and vitest 5.0.5. `vite` is the same
  # release under its aliased core package (an npm alias Dependabot cannot
  # bump: move it by hand with `vite-plus`), and `vitest` must match
  # vite-plus's exact pin (1.4.0 → 5.0.5) because the `vitest@*` override
  # forces every resolution to the catalog singleton.
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

# Peer ranges the PUBLISHED packages declare. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges. `pnpm
# publish` replaces `catalog:peers` with these ranges in the published
# manifest.
catalogs:
  peers:
    # Caret, not `>=`: on 0.x a minor release may break the combinator API
    # the grammars are written against.
    '@thomasfosterau/effect-parse': ^0.2.0
    # rc.118 removed every `effect/unstable/*` export path (now `effect/http`,
    # `effect/sql`, ...), which the SPARQL client, server and SQL backend
    # import: the floor is rc.118, the family's floor.
    effect: '>=4.0.0-rc.118'

overrides:
  # undici <8.12.2 — GHSA-xjj6-f33q-929c (high): an unhandled error on a
  # response with excessive content-encodings is a denial of service
  # (#28). Reached transitively (@effect/platform-node > undici), whose
  # range admits the fix but whose lockfile resolution stayed below it.
  # Drop once that resolution reaches >=8.12.2 on its own.
  undici: ^8.12.2
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: 'catalog:'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
nodeLinker: hoisted
allowBuilds:
  '@effect/tsgo': true
  esbuild: true
  fallow: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

# Supply-chain delay (owner's policy, gardeneria #1149, relaxed to 8 hours on
# 2026-10-30): hold newly published versions for 8 hours (unit: MINUTES)
# before pnpm will install them. Dependabot's `cooldown` (whole days only)
# waits 1 day, longer than this, so it never proposes a version pnpm refuses.
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - '@thomasfosterau/*'
