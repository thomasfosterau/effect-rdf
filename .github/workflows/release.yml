name: Release

# Changesets, split so only publishing waits for approval: `select` picks the
# mode, `version` opens the "chore: version packages" PR, and `publish` (the
# only job in the protected `release` environment with `id-token: write`)
# publishes to npm through trusted publishing. See docs/PUBLISHING.md.

on:
  push:
    branches: [trunk]

permissions: {}

env:
  # Stops `pnpm run` re-installing with lifecycle scripts after the
  # `--ignore-scripts` install.
  pnpm_config_verify_deps_before_run: 'false'

jobs:
  # Nothing privileged runs unless every action matches actions.lock.
  verify-lockfile:
    if: github.repository == 'thomasfosterau/effect-rdf' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the workflow lockfile
        run: gh actions-lock --verify

  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-rdf' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: [verify-lockfile, select]
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - id: version
        uses: changesets/action/version@v2.1.2
        with:
          script: vp run changeset:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
      # The PR is opened by the workflow's token, and Changesets has no
      # assignee setting.
      - name: Assign the owner to the version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --add-assignee thomasfosterau

  publish:
    name: Publish to npm
    needs: [verify-lockfile, select]
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write # release tags and GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          registry-url: https://registry.npmjs.org
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      # `vp run release` (vite.config.ts): builds every package and runs the
      # offline dist check, then `vp pm publish -r` (pnpm, which performs the
      # OIDC exchange, adds provenance and skips versions npm already has),
      # then `changeset git-tag` reports the new tags through CHANGESETS_OUTPUT,
      # and the action pushes them and creates the releases.
      - uses: changesets/action/publish@v2.1.2
        with:
          script: vp run release
