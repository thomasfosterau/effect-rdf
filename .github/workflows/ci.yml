name: CI

# ONE workflow whose only command is `vp run ci`: the whole pipeline is the
# `ci` task in vite.config.ts (format and lint, the type gates, the W3C
# conformance suites, the tests, the build, the dist import guard and the
# audit, in that order), so a local `vp run ci` and this workflow are the same
# thing. It runs on the current LTS and the current release line of Node.js;
# there is no aggregate job, so a ruleset requires each matrix entry by name:
# `ci (node lts)` and `ci (node latest)`.
# Nothing here needs a database, a stage or a credential (the PostgreSQL suite
# runs on PGlite in-process).

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    env:
      # A ceiling for every Node process in the pipeline. NODE_OPTIONS is
      # inherited by every child, including each vitest fork; the
      # conformance suites hold whole W3C manifests in memory.
      NODE_OPTIONS: --max-old-space-size=4096
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+ at the catalog's `vite-plus` pin, the matrix's Node.js and the
      # `packageManager`'s pnpm, with the pnpm store cache. An exact tag: the
      # action's moving `v1` tag is frozen at v1.15.0, and its releases are
      # immutable.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-${{ matrix.node }}-
      - name: CI
        run: vp run ci
