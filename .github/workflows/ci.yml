name: CI

# One job running `vp run ci`; the pipeline lives in vite.config.ts, so a local
# `vp run ci` is the same thing. Required checks: `ci (node lts)`, `ci (node latest)`.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
    env:
      # Inherited by every vitest fork; the conformance suites hold whole W3C
      # manifests in memory.
      NODE_OPTIONS: --max-old-space-size=4096
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: ${{ matrix.node }}
          cache: true
          run-install: true
      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-${{ matrix.node }}-
      - name: CI
        run: vp run ci

  devcontainer:
    name: devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: false
      - name: Build and start the container
        run: vp dlx @devcontainers/cli@0.89.0 up --workspace-folder .
      - name: Check vp inside the container
        run: vp dlx @devcontainers/cli@0.89.0 exec --workspace-folder . vp --version
