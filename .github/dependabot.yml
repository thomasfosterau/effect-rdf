# Shared policy (one copy per thomasfosterau repository): first-party packages
# daily, everything else weekly on Wednesday morning in Melbourne. Security
# updates ignore the schedule and open as soon as an advisory lands, one PR
# each. By-hand follow-ups for the lockstep sets are in docs/CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '06:00'
      timezone: 'Australia/Melbourne'
    open-pull-requests-limit: 10
    assignees:
      - thomasfosterau
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    # Matches pnpm's `minimumReleaseAge` (24 hours).
    cooldown:
      default-days: 1
    # A dependency joins the first group it matches, so the named sets come
    # first and `toolchain` takes every other development dependency.
    # Production dependencies outside a named set get a PR each.
    groups:
      effect:
        patterns:
          - 'effect'
          - '@effect/*'
        exclude-patterns:
          - '@effect/language-service'
          - '@effect/tsgo'
      toolchain:
        dependency-type: 'development'
        patterns:
          - '*'

  # Dependabot regenerates .github/workflows/actions.lock in the same PR.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '06:00'
      timezone: 'Australia/Melbourne'
    assignees:
      - thomasfosterau
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '06:00'
      timezone: 'Australia/Melbourne'
    assignees:
      - thomasfosterau
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 1
