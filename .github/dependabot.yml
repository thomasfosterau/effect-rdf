# Dependabot version-update configuration (copied from the effect-web
# library, itself from effect-drizzle-ext and the gardeneria application).
#
# `groups` collect dependencies that MUST move together: the Effect 4 release
# line is a lockstep-versioned singleton set; the vitest toolchain is pinned to
# vite-plus's exact versions, so version updates to any of the four (`vite`,
# `vitest`, `@vitest/coverage-istanbul` and `vite-plus`) are
# ignored (they move together by hand, with the @effect/tsgo pin — see
# pnpm-workspace.yaml) while SECURITY updates stay enabled (the ignore is
# scoped to the `version-update:semver-*` update types; a bare
# `dependency-name` ignore would block security updates too).
#
# `@effect/tsgo`, `typescript` (the TS6 alias) and `@typescript/native` are
# one set as well: `effect-tsgo patch` matches the native `tsc` and `oxlint`
# by gitHead / version and hard-errors (UnsupportedTargetPackageVersionError)
# on any pairing it has no artifact for, so a PR moving one alone goes red.
# Their version updates are ignored the same way (security updates stay
# enabled): they move by hand, as a set with `vite-plus`, after checking the
# `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs. The
# `effect` group's `@effect/*` pattern therefore excludes `@effect/tsgo`.
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
      vitest-toolchain:
        patterns:
          - "vitest"
          - "@vitest/coverage-istanbul"
          - "vite-plus"
    ignore:
      - dependency-name: "@effect/tsgo"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "typescript"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@typescript/native"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vitest"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite-plus"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@vitest/coverage-istanbul"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
