# Composite setup shared by every CI job that needs the toolchain.
# `voidzero-dev/setup-vp` installs the Vite+ CLI (`vp`) at the version the
# catalog pins for `vite-plus`, a Node.js runtime and the package manager
# named by `packageManager` (pnpm), and restores the pnpm store cache (keyed
# on pnpm-lock.yaml). Dependencies are then installed with a frozen lockfile
# (retried — see the Install step's own comment for why), so `run-install` is
# off. Later steps call the global `vp`, which delegates to the checkout's
# own `vite-plus`.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Vite+, Node.js and pnpm, restore the package cache, and install dependencies.
runs:
  using: composite
  steps:
    # An exact tag: the action's moving `v1` tag is frozen at v1.15.0, and its
    # releases are immutable.
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.22.0
      with:
        # The current LTS line (the workspace's floor is `engines.node >= 22`).
        node-version: lts
        cache: true
        run-install: false

    # Retried: pnpm's linker can race itself when a package with a build
    # script resolves twice and both copies build — a transient ENOENT on the
    # rename of a `_tmp_<pid>_<hex>` staging directory, seen in gardeneria CI
    # on cold-store runs (see effect-drizzle-ext's copy of this action). Every
    # attempt keeps `--frozen-lockfile` and install scripts, so a
    # deterministic failure (lockfile drift, a policy violation) still fails
    # all three.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
