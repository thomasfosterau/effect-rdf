# Composite setup shared by every CI job that needs the toolchain.
# Sets up Node.js + pnpm, restores the pnpm store cache (keyed on
# pnpm-lock.yaml by setup-node), and installs dependencies with a frozen
# lockfile (retried — see the Install step's own comment for why).
# `vp` and the dev bins land in node_modules/.bin; later steps call them as
# `pnpm exec vp …` (writing node_modules/.bin to GITHUB_PATH is zizmor's
# `github-env` finding: a PR's install scripts could plant binaries there).
# Copied from the effect-drizzle-ext library's action (itself from the gardeneria application).
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Node.js and pnpm, restore the package cache, and install dependencies.
runs:
  using: composite
  steps:
    # pnpm before Node so setup-node's `cache: pnpm` can resolve the store path.
    # The pnpm version comes from the `packageManager` field in package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        # Not `latest`: setup-node takes that from the first entry of the
        # nodejs.org index, pre-releases included (v27.0.0-alpha since
        # 2026-10-29). `*` with `check-latest` is the newest stable release.
        node-version: '*'
        check-latest: true
        cache: pnpm

    # Retried: pnpm's linker can race itself when a package with a build
    # script resolves twice and both copies build — a transient ENOENT on the
    # rename of a `_tmp_<pid>_<hex>` staging directory, seen in gardeneria CI
    # on cold-store runs (see effect-drizzle-ext's copy of this action). Every
    # attempt keeps `--frozen-lockfile` and install scripts, so a
    # deterministic failure (lockfile drift, a policy violation) still fails
    # all three.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
